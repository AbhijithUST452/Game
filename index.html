<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Schrödinger Paradox</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="arcade-shell">
    <header class="title-panel">
      <h1>🐈 The Schrödinger Paradox</h1>
      <p>Cyberpunk quantum pursuit. Survive the experiment, or box the anomaly.</p>
    </header>

    <section id="game-container" aria-label="The Schrödinger Paradox game area">
      <canvas id="gameCanvas" width="900" height="600"></canvas>

      <div id="ui-layer">
        <div class="score-card cyan"><span id="cat-name-label">Cat</span><strong id="cat-score">0</strong></div>
        <div id="timer" class="timer">60</div>
        <div class="score-card magenta"><span id="schro-name-label">Schrödinger</span><strong id="schro-score">0</strong></div>
      </div>
      <div id="cat-powerup-ui" class="hud-chip">CAT BUFF: NONE</div>
      <div id="powerup-ui" class="hud-chip">BOX: STANDARD ∞</div>

      <div id="mode-screen" class="screen overlay">
        <h2>Select Experiment</h2>
        <button data-mode="solo-cat" class="neon-btn">Solo Cat: Evade AI</button>
        <button data-mode="solo-schro" class="neon-btn">Solo Schrödinger: Hunt AI</button>
        <button data-mode="multi" class="neon-btn">Local Multiplayer PvP</button>
      </div>

      <div id="name-screen" class="screen overlay hidden">
        <h2>Identity Calibration</h2>
        <label>Cat Name <input id="cat-name" maxlength="15" placeholder="Neon Cat" /></label>
        <label>Schrödinger Name <input id="schro-name" maxlength="15" placeholder="Dr. Schrödinger" /></label>
        <div class="row"><button id="back-to-mode" class="ghost-btn">Back</button><button id="names-next" class="neon-btn">Continue</button></div>
      </div>

      <div id="instructions-screen" class="screen overlay hidden">
        <h2 id="instructions-title">Rules</h2>
        <div id="instructions-body"></div>
        <button id="start-game" class="neon-btn">Start Match</button>
      </div>

      <div id="game-over-screen" class="screen overlay hidden">
        <h2 id="winner-text">Winner</h2>
        <div id="final-scores"></div>
        <div id="achievements"></div>
        <div class="row"><button id="replay" class="neon-btn">Replay</button><button id="change-mode" class="ghost-btn">Change Mode</button></div>
      </div>
    </section>

    <section id="audio-controls">
      <button id="mute-btn" class="ghost-btn">Mute</button>
      <label>Music Volume <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
      <audio id="bgm" loop preload="auto" src="assets/bgaudio.mp3"></audio>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
